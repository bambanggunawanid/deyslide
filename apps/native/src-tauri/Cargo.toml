[package]
name = "deyslide-app"
description = "The Deyslide app for Windows, macOS, Linux, Android and iOS, and `deyslide mcp` for Claude Code."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "deyslide"

# Android loads the app as a shared library and iOS links it as a static
# one; computers run the `deyslide` binary.
[lib]
name = "deyslide_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deyslide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
base64 = "0.22"
deyslide-core = { path = "../../../crates/deyslide-core" }
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
notify = "8"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-http = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-os = "2.4.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"

# One window per computer, the OS trash for deleted projects and decks, and
# updates from new releases (a phone installs those itself).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.13.1"
trash = "5"

# Phones finish signing in through a link back into the app.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2.6.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
