server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Relative redirects, so /demo becomes /demo/ on the public host and port.
  absolute_redirect off;

  # The web app uses history routing, so unknown paths fall back to its shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The API runs in the same pod. Request headers, including the tunnel's
  # CF-Connecting-IP, pass through unchanged.
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 10m;
  }

  # The MCP server for Claude Code and other agents. Answers can hold slide
  # images, and a render can take a while, so nothing is buffered.
  location = /mcp {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 2m;
  }

  # OAuth discovery documents MCP clients read before they sign in.
  location /.well-known/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # The demo deck is a separate Slidev build with its own history routing.
  location /demo/ {
    try_files $uri $uri/ /demo/index.html;
  }

  # Vite puts a content hash in every asset name, so they never change.
  # The slide preview runs in a sandboxed iframe with an opaque origin, so
  # its scripts and the Motion Canvas bundles load as cross origin requests.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";
  }

  location /animations/ {
    add_header Access-Control-Allow-Origin "*";
  }

  location /demo/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
