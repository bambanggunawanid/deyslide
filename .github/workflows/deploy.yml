name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://deyslide.bambanggunawan.id
    env:
      SERVER: ryzen@${{ vars.TAILSCALE_SERVER_IP }}
      PUBLIC_URL: https://deyslide.bambanggunawan.id
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # The scenarios run the on-device MCP server, built with cargo.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: BDD scenarios
        run: pnpm test

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_KEY }}
          tags: tag:ci
          ping: ${{ vars.TAILSCALE_SERVER_IP }}

      # Tailscale SSH authenticates with the tailnet identity, so no key is needed.
      # Optional settings may be empty: the API then hides that sign in option,
      # or the assistant when ANTHROPIC_API_KEY is empty.
      # The server's .env gets the tunnel token on every deploy. The database
      # password and the auth secret are made there once, and never leave it.
      - name: Upload settings
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASSISTANT_MONTHLY_LIMIT_USD: ${{ vars.ASSISTANT_MONTHLY_LIMIT_USD }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_SECRET: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_SECRET }}
          # Project files are private, in the private bucket.
          R2_BUCKET: ${{ vars.R2_BUCKET || 'deyslide-private-assets' }}
          MEDIA_ACCOUNT_LIMIT_MB: ${{ vars.MEDIA_ACCOUNT_LIMIT_MB }}
        run: |
          ssh_opts=(-o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20)
          # The script goes as the remote command and the token on stdin, so the token
          # never appears in a command line.
          set_token=$(cat <<'SCRIPT'
          set -euo pipefail
          cd ~/projects/deyslide
          umask 077
          touch .env
          read -r token
          {
            grep -v '^CLOUDFLARE_TUNNEL_TOKEN=' .env || true
            printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$token"
            for name in POSTGRES_PASSWORD BETTER_AUTH_SECRET; do
              if ! grep -q "^$name=." .env; then
                echo "Creating $name (first deploy)" >&2
                printf '%s=%s\n' "$name" "$(openssl rand -hex 32)"
              fi
            done
          } > .env.new
          mv .env.new .env
          SCRIPT
          )
          printf '%s\n' "$CLOUDFLARE_TUNNEL_TOKEN" | ssh "${ssh_opts[@]}" "$SERVER" "$set_token"
          {
            printf 'PUBLIC_URL=%s\n' "$PUBLIC_URL"
            for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_EMAIL_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GH_OAUTH_CLIENT_ID GH_OAUTH_CLIENT_SECRET ANTHROPIC_API_KEY ASSISTANT_MONTHLY_LIMIT_USD CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_ACCESS_KEY_SECRET R2_BUCKET MEDIA_ACCOUNT_LIMIT_MB; do
              printf '%s=%s\n' "$name" "${!name}"
            done
          } | ssh "${ssh_opts[@]}" "$SERVER" 'umask 077 && cat > ~/projects/deyslide/server.env'

      # The server pulls this commit and builds the images itself. Compose keeps the
      # old containers running until the new images are built.
      - name: Pull and start containers
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SERVER" 'bash -se' <<SCRIPT
          set -euo pipefail
          cd ~/projects/deyslide
          git fetch --quiet origin main
          git merge --ff-only --quiet ${{ github.sha }}

          # Rootless Podman keeps its state in the user's runtime dir, which a
          # non-interactive SSH login may not set. The docker CLI talks to Podman's
          # socket and builds with the server's BuildKit builder, which builds the
          # shared stage once and keeps base images cached (Docker Hub limits
          # anonymous pulls).
          export XDG_RUNTIME_DIR="\${XDG_RUNTIME_DIR:-/run/user/\$(id -u)}"
          export DOCKER_HOST="unix://\$XDG_RUNTIME_DIR/podman/podman.sock"
          docker compose up -d --build --remove-orphans --wait --wait-timeout 300
          docker image prune -f >/dev/null
          docker compose ps
          SCRIPT

      - name: Check the public site
        run: |
          # The web app answers at the root, the demo deck under /demo/ and the API under /api/.
          check() {
            curl -fsS --max-time 10 "$PUBLIC_URL/" | grep -q '<div id="app">' \
              && curl -fsS --max-time 10 "$PUBLIC_URL/demo/" | grep -q '/demo/assets/' \
              && curl -fsS --max-time 10 "$PUBLIC_URL/api/health" | grep -q '"ok":true'
          }
          for attempt in $(seq 1 12); do
            if check; then
              echo "$PUBLIC_URL, $PUBLIC_URL/demo/ and $PUBLIC_URL/api/ are live"
              exit 0
            fi
            sleep 5
          done
          echo "$PUBLIC_URL did not serve the web app, the demo deck and the API"
          for path in / /demo/ /api/health; do
            curl -sS -o /dev/null -w "$path HTTP %{http_code}\n" --max-time 10 "$PUBLIC_URL$path" || true
          done
          exit 1
