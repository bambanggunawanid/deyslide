name: Release

# Pushing a tag such as v0.1.0 publishes a GitHub Release. GitHub writes the
# notes from the pull requests merged since the previous tag, grouped by the
# labels in .github/release.yml. The release starts as a draft while the app
# jobs build Deyslide for Windows, macOS, Linux, Android and iOS. The publish
# job then attaches their installers and latest.json (what the apps on
# computers read to update themselves) and publishes the release once every
# required build passed, so the latest release never links to files that
# are not there yet. The iOS build is required only when the Apple account
# is in the secrets: it goes to TestFlight, not to the release.
#
# Running the workflow by hand builds the same files as workflow artifacts
# and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The app jobs run build code from many packages, so they only read. The
# two jobs that write to the release run none of it (publish runs one small
# script of this repository, with no dependencies).
permissions:
  contents: read

jobs:
  release:
    name: Draft GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A pre-release tag such as v1.2.3-beta.1 is marked as one, so the
      # download page, which reads the latest release, keeps offering the
      # last stable version. Build metadata after "+" may hold a hyphen
      # too, so it is left out of the check.
      - name: Create a draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          extra=()
          case "${version%%+*}" in
            *-*) extra=(--prerelease) ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag --draft "${extra[@]}"

  windows:
    name: Windows app
    needs: release
    # Also runs when the release job was skipped, in a manual run.
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Updates: the public key is a repository variable; whether the
      # signing key is set is all this step learns of that secret.
      - name: Read the version from the tag
        id: version
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          SIGNS_UPDATES: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: bash apps/native/scripts/app-version.sh

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # With updates on, Tauri signs each installer with the updater's
      # private key into a .sig file next to it.
      - name: Build the installers
        env:
          BUNDLES: ${{ steps.version.outputs.msi == 'true' && 'msi,nsis' || 'nsis' }}
          VERSION_CONFIG: ${{ steps.version.outputs.config }}
          UPDATES: ${{ steps.version.outputs.updates }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$UPDATES" != true ]; then unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; fi
          pnpm --filter @deyslide/native tauri build --bundles "$BUNDLES" --config "$VERSION_CONFIG"

      # Claude Code starts the app's executable as `deyslide mcp` with pipes,
      # so this checks the Windows build answers over them.
      - name: Check the MCP server
        run: node apps/native/scripts/smoke-mcp.mjs target/release/deyslide.exe

      - name: Collect the installers
        run: |
          shopt -s nullglob
          mkdir -p out
          cp target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig out/
          if [ -d target/release/bundle/msi ]; then cp target/release/bundle/msi/*.msi target/release/bundle/msi/*.msi.sig out/; fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: deyslide-windows
          path: out/*

  macos:
    name: macOS app
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Updates: the public key is a repository variable; whether the
      # signing key is set is all this step learns of that secret.
      - name: Read the version from the tag
        id: version
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          SIGNS_UPDATES: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: bash apps/native/scripts/app-version.sh

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # One app for Apple silicon and Intel Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Without the Apple secrets the app is signed ad hoc (signingIdentity
      # "-" in tauri.conf.json), and people allow it once in System
      # Settings. The secrets reach Tauri as they are, in this step's
      # environment (a certificate in base64 spans many lines); the empty
      # ones are removed, since Tauri would try to use them.
      - name: Build the app
        env:
          VERSION_CONFIG: ${{ steps.version.outputs.config }}
          UPDATES: ${{ steps.version.outputs.updates }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          apple=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Signing with the Apple certificate"
            for name in "${apple[@]}"; do
              if [ -z "${!name}" ]; then unset "$name"; fi
            done
          else
            echo "No Apple certificate: signing ad hoc"
            unset "${apple[@]}"
          fi
          if [ "$UPDATES" != true ]; then unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; fi
          pnpm --filter @deyslide/native tauri build --target universal-apple-darwin --bundles app,dmg --config "$VERSION_CONFIG"

      # The executable inside the app bundle, as Claude Code starts it.
      - name: Check the MCP server
        run: |
          app=(target/universal-apple-darwin/release/bundle/macos/*.app)
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app[0]}/Contents/Info.plist")
          node apps/native/scripts/smoke-mcp.mjs "${app[0]}/Contents/MacOS/$exe"

      # The update is the app itself in a .tar.gz, named after the version
      # here so releases never share a file name.
      - name: Collect the disk image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg out/
          update=target/universal-apple-darwin/release/bundle/macos/Deyslide.app.tar.gz
          if [ -f "$update.sig" ]; then
            cp "$update" "out/Deyslide_${VERSION}_universal.app.tar.gz"
            cp "$update.sig" "out/Deyslide_${VERSION}_universal.app.tar.gz.sig"
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: deyslide-macos
          path: out/*

  linux:
    name: Linux app
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    # The oldest supported Ubuntu, so the AppImage and the .deb also run on
    # Ubuntu 22.04 and Debian 12 (glibc 2.35 and newer).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Updates: the public key is a repository variable; whether the
      # signing key is set is all this step learns of that secret.
      - name: Read the version from the tag
        id: version
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          SIGNS_UPDATES: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: bash apps/native/scripts/app-version.sh

      - name: Install WebKitGTK and the bundling tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Build the AppImage and the .deb
        env:
          VERSION_CONFIG: ${{ steps.version.outputs.config }}
          UPDATES: ${{ steps.version.outputs.updates }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$UPDATES" != true ]; then unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; fi
          pnpm --filter @deyslide/native tauri build --bundles deb,appimage --config "$VERSION_CONFIG"

      - name: Check the MCP server
        run: node apps/native/scripts/smoke-mcp.mjs target/release/deyslide

      - name: Collect the packages
        run: |
          shopt -s nullglob
          mkdir -p out
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*.AppImage.sig out/
          cp target/release/bundle/deb/*.deb target/release/bundle/deb/*.deb.sig out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: deyslide-linux
          path: out/*

  android:
    name: Android app
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the version from the tag
        id: version
        run: bash apps/native/scripts/app-version.sh

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Phones: 64 bit and 32 bit ARM.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # A release APK is signed with the project's own key, kept in four
      # secrets. Without them the APK is unsigned and stays a workflow
      # artifact: an update must carry the signature of the installed app,
      # and reinstalling would delete the decks kept inside the app.
      - name: Use the signing key when it is set
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ] && [ -n "$ANDROID_STORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deyslide-release.jks"
            echo "keystore=$RUNNER_TEMP/deyslide-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key: the APK stays a workflow artifact"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # app/build.gradle.kts reads the key from these variables as they
      # are, so the passwords need no escaping. With no key file it signs
      # nothing.
      - name: Build the APK
        env:
          VERSION_CONFIG: ${{ steps.version.outputs.config }}
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: pnpm --filter @deyslide/native tauri android build --apk --target aarch64 --target armv7 --config "$VERSION_CONFIG"

      - name: Collect the APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          apks=apps/native/src-tauri/gen/android/app/build/outputs/apk/universal/release
          if [ "$SIGNED" = true ]; then
            cp "$apks/app-universal-release.apk" "out/Deyslide_${VERSION}_android.apk"
          else
            cp "$apks/app-universal-release-unsigned.apk" "out/Deyslide_${VERSION}_android-unsigned.apk"
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: deyslide-android
          path: out/*

  ios:
    name: iOS app
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    # Xcode runs on macOS only, so the Xcode project is made and built here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the version from the tag
        id: version
        run: bash apps/native/scripts/app-version.sh

      # A build for iPhones and iPads needs the whole Apple account: the
      # distribution certificate, its provisioning profile, the team and an
      # App Store Connect API key for TestFlight. Without it the app is
      # built for the iOS simulator, which keeps the build checked.
      - name: Use the Apple account when it is set
        id: signing
        env:
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_PROVISIONING_PROFILE != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          if [ "$SIGNED" = true ]; then
            echo "Building a signed app for TestFlight"
          else
            echo "No Apple account: building for the iOS simulator only"
          fi
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # iPhones and iPads, and the simulator on Apple silicon Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Until the project is committed, every run makes it from Tauri's
      # template (which needs XcodeGen).
      - name: Create the Xcode project when it is missing
        working-directory: apps/native
        run: |
          if [ -d src-tauri/gen/apple ]; then
            echo "Using the committed Xcode project"
          else
            command -v xcodegen > /dev/null || brew install xcodegen
            pnpm tauri ios init --ci
          fi

      # The link scheme that finishes a sign in, the name, orientations and
      # the export answer for TestFlight, and the app's icons.
      - name: Apply the app's iOS settings
        working-directory: apps/native
        run: |
          shopt -s nullglob
          plists=(src-tauri/gen/apple/*_iOS/Info.plist)
          if [ ${#plists[@]} -ne 1 ]; then
            echo "Expected one Info.plist in src-tauri/gen/apple/*_iOS, found ${#plists[@]}." >&2
            exit 1
          fi
          python3 scripts/ios-settings.py "${plists[0]}"
          icons=src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset
          if [ -d "$icons" ]; then cp src-tauri/icons/ios/*.png "$icons/"; fi

      # Download this to commit the generated project to the repository.
      - uses: actions/upload-artifact@v4
        with:
          name: ios-project
          path: apps/native/src-tauri/gen/apple
          include-hidden-files: true

      # iOS takes a version of three numbers, so a pre-release tag builds
      # its plain version, and the run number tells TestFlight builds apart.
      # Tauri's IOS_* variables carry the certificate and profile as they are.
      - name: Build the app
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          CORE_VERSION: ${{ steps.version.outputs.core }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          config="$RUNNER_TEMP/deyslide-ios-version.json"
          printf '{"version":"%s"}\n' "$CORE_VERSION" > "$config"
          if [ "$SIGNED" = true ]; then
            pnpm --filter @deyslide/native tauri ios build --export-method app-store-connect --build-number "$BUILD_NUMBER" --config "$config"
          else
            unset APPLE_DEVELOPMENT_TEAM IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION
            pnpm --filter @deyslide/native tauri ios build --target aarch64-sim --debug --config "$config"
          fi

      - name: Collect the build
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          build=apps/native/src-tauri/gen/apple/build
          if [ "$SIGNED" = true ]; then
            ipa=$(find "$build" -name '*.ipa' | head -n 1)
            cp "$ipa" "out/Deyslide_${VERSION}_ios.ipa"
          else
            app=$(find "$build" -name '*.app' -type d -prune | head -n 1)
            ditto -c -k --keepParent "$app" "out/Deyslide_${VERSION}_ios-simulator.zip"
          fi
          ls -l out

      # Not named deyslide-*: an iOS build never goes into the release.
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: out/*

      # altool finds the API key by its id in this folder. The key is the
      # text of the .p8 file, or that text in base64.
      - name: Upload the build to TestFlight
        if: steps.signing.outputs.signed == 'true' && github.event_name == 'push'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          keys="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys"
          key="$keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          if [[ "$APPLE_API_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$APPLE_API_KEY" > "$key"
          else
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          xcrun altool --upload-app --type ios --file out/*.ipa --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

  publish:
    name: Publish GitHub Release
    needs: [release, windows, macos, linux, android, ios]
    # Attaches what was built even when a build failed, but publishes only
    # when every required build passed. Otherwise the release stays a draft
    # for a person to finish. iOS is required only with the Apple account
    # in the secrets, the same rule its job signs by.
    if: ${{ github.event_name == 'push' && !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      IOS_REQUIRED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_PROVISIONING_PROFILE != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      # Only the script that writes latest.json.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: apps/native/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: deyslide-*
          path: out
          merge-multiple: true

      # The apps on computers read latest.json from the latest release: the
      # version, the release notes and a signed file for each system. A
      # release without signed files has none, and its apps link to the
      # download page instead.
      - name: Write latest.json for updates
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          node apps/native/scripts/updater-manifest.mjs out "$TAG" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/notes.md" out/latest.json

      # An unsigned APK cannot be installed, so it stays a workflow artifact.
      - name: Attach the installers
        run: |
          rm -f out/*-unsigned.apk
          shopt -s nullglob
          files=(out/*)
          ls -l "${files[@]}"
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi

      - name: Publish the release
        if: needs.windows.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success' && needs.android.result == 'success' && (env.IOS_REQUIRED != 'true' || needs.ios.result == 'success')
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Keep the release a draft
        if: needs.windows.result != 'success' || needs.macos.result != 'success' || needs.linux.result != 'success' || needs.android.result != 'success' || (env.IOS_REQUIRED == 'true' && needs.ios.result != 'success')
        run: echo "::warning::A build failed, so $TAG stays a draft. Run the failed jobs again, or publish it by hand."
