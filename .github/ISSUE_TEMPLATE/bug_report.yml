name: Bug report
description: Something in Deyslide does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first so we can keep one thread per problem.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or slide markdown that shows the problem.
      placeholder: |
        1. Add `<DeyslideScene3D focus="cache" />` to a slide
        2. Run `pnpm dev`
        3. Open the slide
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - DeyslideScene3D
        - DeyslideAlgoPlayer
        - DeyslideLiveSandbox
        - Motion Canvas animations
        - PDF export (pnpm export)
        - Video export (pnpm export:video)
        - Build or dev server
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Slide view
        - Presenter view
        - Overview
        - PDF export
        - Video export
        - Static build
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions help us reproduce the problem.
      value: |
        - Deyslide version or commit:
        - Node.js:
        - pnpm:
        - Browser:
        - Operating system:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Console output, terminal errors or screenshots.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/bambanggunawanid/deyslide/blob/main/CODE_OF_CONDUCT.md).
          required: true
